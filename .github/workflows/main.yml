name: Android CI & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает системе права на автоматическое создание релизов

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # Настраиваем Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Запускаем компиляцию APK
    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    # Автоматически создаем релиз и прикрепляем чистый APK
    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.\${{ github.run_number }}"
        name: "Spina Release v1.0.\${{ github.run_number }}"
        body: |
          🚀 Автоматическая сборка проекта Spina.
          
          **Инструкция по установке:** Скачайте прикрепленный файл `app-debug.apk` ниже прямо на ваш Android-смартфон и запустите его. Распаковывать ничего не нужно!
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
