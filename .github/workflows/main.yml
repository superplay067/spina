name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # Используем официальный экшен от Gradle, который сам установит нужную систему сборки
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Запускаем сборку напрямую через установленный gradle, а не через файл gradlew
    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spina-debug-apk
        path: app/build/outputs/apk/debug/
