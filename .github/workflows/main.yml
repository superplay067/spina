name: Android CI & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает права на создание релизов в репозитории

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # Настраиваем Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Запускаем компиляцию APK
    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    # Создаем релиз через стандартную утилиту GitHub CLI (gh)
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0.${{ github.run_number }}"
        gh release create "$TAG_NAME" \
          app/build/outputs/apk/debug/app-debug.apk \
          --title "Spina Release $TAG_NAME" \
          --notes "🚀 Автоматическая сборка проекта Spina. Скачайте прикрепленный файл app-debug.apk ниже прямо на ваш Android-смартфон и запустите его."
